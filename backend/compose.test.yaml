name: fieldproof402-test
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: fieldproof_test, POSTGRES_USER: fieldproof, POSTGRES_PASSWORD: test-password }
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fieldproof"], interval: 2s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment: { MINIO_ROOT_USER: fieldproof, MINIO_ROOT_PASSWORD: test-storage-password }
    ports: ["127.0.0.1:59000:9000"]
    tmpfs: [/data]
